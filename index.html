<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>てんやくノート - 自分だけの点訳学習＆ルール検索帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        paper: '#FAF7F2',
                        cream: '#F3EDE2',
                        ink: {
                            800: '#27272A',
                            900: '#18181B',
                        },
                        plum: {
                            50: '#FAF5FF',
                            100: '#F3E8FF',
                            600: '#7E22CE',
                            700: '#6B21A8',
                            800: '#581C87',
                        },
                        terracotta: {
                            50: '#FFF7ED',
                            100: '#FFEDD5',
                            600: '#C2410C',
                            700: '#9A3412',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF7F2;
            color: #18181B;
            /* ノート帳のような微細な方眼背景 */
            background-image: radial-gradient(#D6CFC2 0.85px, transparent 0.85px);
            background-size: 20px 20px;
            -webkit-tap-highlight-color: transparent;
        }
        /* 点字の凸凹を表現するボタン */
        .braille-dot-btn {
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .braille-dot-btn.active {
            background-color: #581C87;
            border-color: #581C87;
            color: #FFFFFF;
            box-shadow: 0 3px 8px rgba(88, 28, 135, 0.35), inset 0 1px 3px rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        .braille-dot-btn.inactive {
            background-color: #FFFFFF;
            border-color: #CBD5E1;
            color: #475569;
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.06);
        }
        .braille-dot-btn.inactive:hover {
            border-color: #7E22CE;
            background-color: #FAF5FF;
        }
        /* 点字マス目ガイド表示（Unicode点字ブロック用） */
        .braille-cells-guided .b-cell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.55em;
            height: 1.85em;
            margin: 2px;
            background-color: #FFFFFF;
            border: 1.5px solid #D6CFC2;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .braille-cells-guided .b-cell.is-space {
            background-color: #F3EDE2;
            border: 1.5px dashed #A8A29E;
            position: relative;
        }
        .braille-cells-guided .b-cell.is-space::after {
            content: '空白';
            font-size: 9px;
            color: #78716C;
            font-family: "Noto Sans JP", sans-serif;
            letter-spacing: -0.05em;
        }
        /* 点字隠し（テストモード） */
        .braille-hidden-blur {
            filter: blur(8px);
            user-select: none;
            opacity: 0.35;
            transition: all 0.25s ease;
        }
        .braille-hidden-blur:hover {
            filter: blur(4px);
            opacity: 0.55;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF7F2;
        }
        ::-webkit-scrollbar-thumb {
            background: #C7BFA8;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-plum-100 selection:text-plum-800">

    <!-- ========================================== -->

            <div class="flex items-center gap-3">

                        <circle cx="13" cy="12" r="1.2" fill="#A855F7"/>
                        <circle cx="5" cy="20" r="1.2" fill="#A855F7"/>
                        <circle cx="13" cy="20" r="2.2" fill="#FFFFFF"/>

                </div>
                <div>

                    <span>📖 点字表</span>
                </button>

                <button type="button" onclick="toggleDataModal(true)" class="flex items-center gap-1.5 bg-white hover:bg-stone-50 text-stone-700 border border-stone-300 text-xs sm:text-sm font-medium px-3 py-2 rounded-xl transition active:scale-95" title="ノートの保存・読み込み">
                    <span>💾 保存/読込</span>
                </button>

                <button type="button" onclick="openEditorModal()" class="flex items-center gap-1.5 bg-plum-700 hover:bg-plum-800 text-white text-xs sm:text-sm font-bold px-4 py-2 rounded-xl shadow-md shadow-plum-700/20 transition active:scale-95">
                    <span class="text-base leading-none">＋</span>
                    <span>新しいノート</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- メインコンテンツ：検索＆ノート一覧         -->
    <!-- ========================================== -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- 検索・フィルタ・表示設定コントロールパネル -->
        <section class="bg-white p-4 sm:p-5 rounded-2xl border border-stone-200 shadow-sm space-y-4">
            <!-- 大型検索バー -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="search-input" oninput="handleSearchChange()"
                    placeholder="タイトル・墨字・点字・解説メモ・タグで瞬時に検索（例：分かち書き、数符、助詞、は...）"
                    class="w-full pl-11 pr-24 py-3.5 bg-paper border-2 border-stone-300 focus:border-plum-600 focus:bg-white rounded-xl text-sm sm:text-base font-medium text-ink-900 placeholder:text-stone-400 focus:outline-none transition">
                <button type="button" id="btn-clear-search" onclick="clearSearch()" class="hidden absolute inset-y-2 right-2 px-3 bg-stone-200 hover:bg-stone-300 text-stone-700 text-xs font-bold rounded-lg transition">
                    クリア
                </button>
            </div>

            <!-- タグフィルターバー -->
            <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs font-bold text-stone-500 mr-1 flex items-center gap-1">
                    <span>🏷️ タグ絞り込み:</span>
                </span>
                <div id="tag-filter-list" class="flex flex-wrap items-center gap-1.5">

                </div>

            <!-- 表示オプション＆件数ステータス -->
            <div class="pt-3 border-t border-stone-100 flex flex-wrap items-center justify-between gap-3 text-xs">

                <div class="flex flex-wrap items-center gap-3 sm:gap-4">

                    <label class="inline-flex items-center gap-1.5 cursor-pointer select-none text-ink-800 font-medium">

                        <span>マス目ガイド（空白可視化）</span>

                    <!-- 点字を隠してテスト切替 -->
                    <button type="button" id="btn-toggle-test-mode" onclick="toggleTestMode()"

                    </button>

            </div>
        </section>

        <!-- ノートカード一覧グリッド -->
        <section id="notes-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">

        </section>

                </button>
                <button type="button" onclick="openEditorModal()" class="px-4 py-2 rounded-xl bg-plum-700 hover:bg-plum-800 text-xs font-bold text-white transition">

                </button>
            </div>
        </div>
    </main>

    <!-- ========================================== -->

            <div class="px-5 py-3.5 border-b border-stone-200 flex items-center justify-between bg-cream">

                                </div>
                                <div class="flex flex-col gap-2.5">

                                    <button type="button" onclick="toggleEditorDot(5)" id="ed-dot-5" class="braille-dot-btn inactive w-11 h-11 rounded-full border-2 font-bold text-xs">5</button>
                                    <button type="button" onclick="toggleEditorDot(6)" id="ed-dot-6" class="braille-dot-btn inactive w-11 h-11 rounded-full border-2 font-bold text-xs">6</button>
