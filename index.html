<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>てんやくノート - 点訳学習＆6点入力ノート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
          },
          colors: {
            paper: '#FAF7F2',
            cream: '#F3EDE2',
            ink: {
              800: '#27272A',
              900: '#18181B',
            },
            plum: {
              50: '#FAF5FF',
              100: '#F3E8FF',
              600: '#7E22CE',
              700: '#6B21A8',
              800: '#581C87',
            },
            terracotta: {
              50: '#FFF7ED',
              100: '#FFEDD5',
              600: '#C2410C',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF7F2;
      color: #18181B;
    }
    .dot-btn {
      transition: transform 0.08s ease, background-color 0.12s ease, box-shadow 0.12s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .dot-btn:active {
      transform: scale(0.95);
    }
    .dot-active {
      background-color: #7E22CE !important;
      color: #FFFFFF !important;
      border-color: #581C87 !important;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div class="max-w-3xl mx-auto px-4 py-6 sm:px-6 sm:py-8">
    <!-- ヘッダー -->
    <header class="mb-6 bg-white/90 border border-stone-200 rounded-2xl p-4 sm:p-5 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-ink-900 tracking-tight">
            てんやくノート
          </h1>
          <p class="text-xs sm:text-sm text-stone-600 mt-1">
            打つときは右側（1・2・3）／左側（4・5・6）、ノート表示（読むとき）は左側（1・2・3）／右側（4・5・6）に自動反転します。
          </p>
        </div>
        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="exportNotes()"
            class="px-3 py-1.5 text-xs font-medium rounded-lg border border-stone-300 bg-cream hover:bg-stone-200 text-ink-800"
          >
            書き出し保存
          </button>
          <label class="px-3 py-1.5 text-xs font-medium rounded-lg border border-stone-300 bg-cream hover:bg-stone-200 text-ink-800 cursor-pointer">
            読み込み
            <input type="file" accept=".json" onchange="importNotes(event)" class="hidden">
          </label>
        </div>
      </div>
    </header>

    <!-- ノート入力フォーム -->
    <section class="bg-white border border-stone-200 rounded-2xl p-4 sm:p-6 shadow-sm mb-6">
      <h2 class="text-base sm:text-lg font-bold text-ink-900 mb-4">新しいメモを記録</h2>

      <form id="note-form" onsubmit="saveNote(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="note-title" class="block text-xs font-semibold text-stone-700 mb-1">
              タイトル・見出し
            </label>
            <input
              id="note-title"
              type="text"
              required
              placeholder="例：濁点・半濁音、拗音、数字符など"
              class="w-full rounded-xl border border-stone-300 bg-paper px-3.5 py-2 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-plum-600"
            >
          </div>
          <div>
            <label for="note-category" class="block text-xs font-semibold text-stone-700 mb-1">
              分類
            </label>
            <select
              id="note-category"
              class="w-full rounded-xl border border-stone-300 bg-paper px-3.5 py-2 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-plum-600"
            >
              <option value="点字の型">点字の型</option>
              <option value="点訳ルール">点訳ルール</option>
              <option value="記号・数字・句読点">記号・数字・句読点</option>
              <option value="気づき・メモ">気づき・メモ</option>
            </select>
          </div>
        </div>

        <!-- 6点入力パッド（打つ向き：右列1-2-3 / 左列4-5-6） -->
        <div class="rounded-2xl border border-plum-100 bg-plum-50/60 p-4">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <p class="text-xs sm:text-sm font-bold text-plum-800">
                6点入力（打つときの配置：右＝1・2・3／左＝4・5・6）
              </p>
              <p class="text-[11px] text-stone-600">
                PCキー操作：J=1, K=2, L=3（右手・右側）／F=4, D=5, S=6（左手・左側）
              </p>
            </div>
            <button
              type="button"
              onclick="clearCurrentDots()"
              class="px-2.5 py-1 text-xs rounded-lg border border-stone-300 bg-white hover:bg-stone-100 text-stone-700"
            >
              選択クリア
            </button>
          </div>

          <!-- 左側に4,5,6、右側に1,2,3を配置 -->
          <div class="grid grid-cols-2 gap-4 max-w-xs mx-auto my-2">
            <div class="flex flex-col items-center gap-2">
              <span class="text-[11px] font-semibold text-stone-500">左側（打つ4・5・6）</span>
              <button type="button" id="btn-dot-4" onclick="toggleDot(4)" class="dot-btn w-14 h-14 rounded-full border-2 border-stone-300 bg-white text-sm font-bold text-ink-900 flex flex-col items-center justify-center">
                <span>4</span>
                <span class="text-[10px] font-normal text-stone-500">F</span>
              </button>
              <button type="button" id="btn-dot-5" onclick="toggleDot(5)" class="dot-btn w-14 h-14 rounded-full border-2 border-stone-300 bg-white text-sm font-bold text-ink-900 flex flex-col items-center justify-center">
                <span>5</span>
                <span class="text-[10px] font-normal text-stone-500">D</span>
              </button>
              <button type="button" id="btn-dot-6" onclick="toggleDot(6)" class="dot-btn w-14 h-14 rounded-full border-2 border-stone-300 bg-white text-sm font-bold text-ink-900 flex flex-col items-center justify-center">
                <span>6</span>
                <span class="text-[10px] font-normal text-stone-500">S</span>
              </button>
            </div>

            <div class="flex flex-col items-center gap-2">
              <span class="text-[11px] font-semibold text-stone-500">右側（打つ1・2・3）</span>
              <button type="button" id="btn-dot-1" onclick="toggleDot(1)" class="dot-btn w-14 h-14 rounded-full border-2 border-stone-300 bg-white text-sm font-bold text-ink-900 flex flex-col items-center justify-center">
                <span>1</span>
                <span class="text-[10px] font-normal text-stone-500">J</span>
              </button>
              <button type="button" id="btn-dot-2" onclick="toggleDot(2)" class="dot-btn w-14 h-14 rounded-full border-2 border-stone-300 bg-white text-sm font-bold text-ink-900 flex flex-col items-center justify-center">
                <span>2</span>
                <span class="text-[10px] font-normal text-stone-500">K</span>
              </button>
              <button type="button" id="btn-dot-3" onclick="toggleDot(3)" class="dot-btn w-14 h-14 rounded-full border-2 border-stone-300 bg-white text-sm font-bold text-ink-900 flex flex-col items-center justify-center">
                <span>3</span>
                <span class="text-[10px] font-normal text-stone-500">L</span>
              </button>
            </div>
          </div>

          <!-- 入力中のプレビュー（打つ向き＆読む向き反転プレビュー） -->
          <div class="mt-4 pt-3 border-t border-plum-100 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-4">
              <div class="text-center">
                <div class="text-[10px] text-stone-500 mb-1">打つ向き</div>
                <div id="write-preview" class="w-14 h-20 rounded-xl border border-stone-300 bg-white grid grid-cols-2 grid-rows-3 place-items-center p-1.5"></div>
              </div>
              <div class="text-stone-400 font-bold text-sm">→ 反転 →</div>
              <div class="text-center">
                <div class="text-[10px] font-semibold text-plum-700 mb-1">読む向き（左123/右456）</div>
                <div id="read-preview" class="w-14 h-20 rounded-xl border-2 border-plum-600 bg-white grid grid-cols-2 grid-rows-3 place-items-center p-1.5"></div>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onclick="addCellToSequence()"
                class="px-3.5 py-2 rounded-xl bg-plum-600 hover:bg-plum-700 text-white text-xs sm:text-sm font-semibold shadow-sm"
              >
                この1マスを追加
              </button>
              <button
                type="button"
                onclick="addSpaceCell()"
                class="px-3 py-2 rounded-xl border border-stone-300 bg-white hover:bg-stone-100 text-xs sm:text-sm text-stone-700"
              >
                空白マス
              </button>
            </div>
          </div>

          <!-- 並べた点字マス列（読む向き：左123/右456） -->
          <div class="mt-3">
            <div class="flex items-center justify-between text-xs text-stone-600 mb-1.5">
              <span>記録する点字列（読む向き・左から順に並びます）</span>
              <button type="button" onclick="clearSequence()" class="text-terracotta-600 hover:underline">
                点字列を消す
              </button>
            </div>
            <div id="sequence-box" class="min-h-[88px] rounded-xl border border-dashed border-stone-300 bg-white p-2.5 flex flex-wrap items-center gap-2">
              <span class="text-xs text-stone-400">まだ点字マスがありません。「この1マスを追加」を押すとここに並びます。</span>
            </div>
          </div>
        </div>

        <!-- ノート本文 -->
        <div>
          <label for="note-body" class="block text-xs font-semibold text-stone-700 mb-1">
            メモ・ルールの説明
          </label>
          <textarea
            id="note-body"
            rows="3"
            placeholder="例：打つときは右123・左456で押す。読むときは左123・右456で見る。"
            class="w-full rounded-xl border border-stone-300 bg-paper px-3.5 py-2 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-plum-600"
          ></textarea>
        </div>

        <button
          type="submit"
          class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-ink-900 hover:bg-ink-800 text-white text-sm font-bold shadow-sm"
        >
          ノートに保存する
        </button>
      </form>
    </section>

    <!-- 検索＆フィルター -->
    <section class="mb-4 flex flex-col sm:flex-row gap-2.5">
      <input
        id="search-input"
        type="search"
        oninput="renderNotes()"
        placeholder="タイトルやメモで検索..."
        class="flex-1 rounded-xl border border-stone-300 bg-white px-3.5 py-2 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-plum-600"
      >
      <select
        id="filter-category"
        onchange="renderNotes()"
        class="rounded-xl border border-stone-300 bg-white px-3.5 py-2 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-plum-600"
      >
        <option value="ALL">すべての分類</option>
        <option value="点字の型">点字の型</option>
        <option value="点訳ルール">点訳ルール</option>
        <option value="記号・数字・句読点">記号・数字・句読点</option>
        <option value="気づき・メモ">気づき・メモ</option>
      </select>
    </section>

    <!-- 保存済みノート一覧 -->
    <section id="notes-list" class="space-y-3"></section>
  </div>

  <script>
    const STORAGE_KEY = 'tenyaku_note_v1';
    let selectedWriteDots = new Set(); // 打つときの点番号（1〜6）
    let currentSequence = [];        // 読む向きの点字マス配列（各要素は [1..6] の配列）
    let notes = loadInitialNotes();

    // 打つときの点（1..6）を、読むときの点（1..6）へ左右反転する対応表
    // 打つとき：右列 1,2,3 / 左列 4,5,6
    // 読むとき：左列 1,2,3 / 右列 4,5,6
    const WRITE_TO_READ_DOT = {
      1: 4,
      2: 5,
      3: 6,
      4: 1,
      5: 2,
      6: 3
    };

    // 読む向きのマス（左列1,2,3 / 右列4,5,6）のグリッド位置（row 0..2, col 0..1）
    const READ_GRID_MAP = [
      { dot: 1, row: 0, col: 0 },
      { dot: 4, row: 0, col: 1 },
      { dot: 2, row: 1, col: 0 },
      { dot: 5, row: 1, col: 1 },
      { dot: 3, row: 2, col: 0 },
      { dot: 6, row: 2, col: 1 }
    ];

    // 打つ向きのマス（左列4,5,6 / 右列1,2,3）のグリッド位置
    const WRITE_GRID_MAP = [
      { dot: 4, row: 0, col: 0 },
      { dot: 1, row: 0, col: 1 },
      { dot: 5, row: 1, col: 0 },
      { dot: 2, row: 1, col: 1 },
      { dot: 6, row: 2, col: 0 },
      { dot: 3, row: 2, col: 1 }
    ];

    function loadInitialNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {
        console.warn('読み込みエラー:', e);
      }
      return [
        {
          id: 'sample-1',
          title: '「あ」の点字（読む向き：左1）',
          category: '点字の型',
          body: '打つときは右上の1を押すと、読む向きでは左上の1として記録されます。',
          cells: [[1]],
          createdAt: new Date().toLocaleDateString('ja-JP')
        }
      ];
    }

    function persistNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function toggleDot(dotNum) {
      if (selectedWriteDots.has(dotNum)) {
        selectedWriteDots.delete(dotNum);
      } else {
        selectedWriteDots.add(dotNum);
      }
      updateInputUI();
    }

    function clearCurrentDots() {
      selectedWriteDots.clear();
      updateInputUI();
    }

    function getFlippedReadDots() {
      const flipped = [];
      selectedWriteDots.forEach((wDot) => {
        const rDot = WRITE_TO_READ_DOT[wDot];
        if (rDot) flipped.push(rDot);
      });
      return flipped.sort((a, b) => a - b);
    }

    function buildMiniCellHtml(activeDots, gridMap, activeColorClass) {
      const set = new Set(activeDots || []);
      let html = '';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 2; c++) {
          const item = gridMap.find((m) => m.row === r && m.col === c);
          const isOn = item && set.has(item.dot);
          html += `<span class="w-2.5 h-2.5 rounded-full ${isOn ? activeColorClass : 'bg-stone-200'}"></span>`;
        }
      }
      return html;
    }

    function updateInputUI() {
      for (let d = 1; d <= 6; d++) {
        const btn = document.getElementById(`btn-dot-${d}`);
        if (!btn) continue;
        if (selectedWriteDots.has(d)) {
          btn.classList.add('dot-active');
        } else {
          btn.classList.remove('dot-active');
        }
      }

      const writeArr = Array.from(selectedWriteDots);
      const readArr = getFlippedReadDots();

      document.getElementById('write-preview').innerHTML =
        buildMiniCellHtml(writeArr, WRITE_GRID_MAP, 'bg-stone-700');
      document.getElementById('read-preview').innerHTML =
        buildMiniCellHtml(readArr, READ_GRID_MAP, 'bg-plum-600');

      renderSequenceBox();
    }

    function addCellToSequence() {
      const readArr = getFlippedReadDots();
      currentSequence.push(readArr);
      selectedWriteDots.clear();
      updateInputUI();
    }

    function addSpaceCell() {
      currentSequence.push([]);
      updateInputUI();
    }

    function removeCellAt(index) {
      currentSequence.splice(index, 1);
      renderSequenceBox();
    }

    function clearSequence() {
      currentSequence = [];
      renderSequenceBox();
    }

    function renderSequenceBox() {
      const box = document.getElementById('sequence-box');
      if (currentSequence.length === 0) {
        box.innerHTML = '<span class="text-xs text-stone-400">まだ点字マスがありません。「この1マスを追加」を押すとここに並びます。</span>';
        return;
      }

      box.innerHTML = currentSequence.map((dots, idx) => {
        const label = dots.length > 0 ? `左/右:${dots.join(',')}` : '空白';
        return `
          <div class="group relative flex flex-col items-center rounded-xl border border-plum-200 bg-plum-50/40 px-2.5 py-2">
            <div class="w-11 h-16 rounded-lg border border-stone-300 bg-white grid grid-cols-2 grid-rows-3 place-items-center p-1">
              ${buildMiniCellHtml(dots, READ_GRID_MAP, 'bg-plum-600')}
            </div>
            <span class="text-[10px] text-stone-600 mt-1">${label}</span>
            <button
              type="button"
              onclick="removeCellAt(${idx})"
              title="このマスを削除"
              class="mt-1 text-[10px] text-terracotta-600 hover:underline"
            >
              削除
            </button>
          </div>
        `;
      }).join('');
    }

    function saveNote(event) {
      event.preventDefault();
      const titleInput = document.getElementById('note-title');
      const categoryInput = document.getElementById('note-category');
      const bodyInput = document.getElementById('note-body');

      const title = titleInput.value.trim();
      if (!title) return;

      // 未追加の選択中の点があれば、自動で反転して1マス追加する
      let cellsToSave = currentSequence.map((c) => [...c]);
      if (selectedWriteDots.size > 0) {
        cellsToSave.push(getFlippedReadDots());
      }

      const newNote = {
        id: String(Date.now()),
        title,
        category: categoryInput.value,
        body: bodyInput.value.trim(),
        cells: cellsToSave,
        createdAt: new Date().toLocaleDateString('ja-JP')
      };

      notes.unshift(newNote);
      persistNotes();

      titleInput.value = '';
      bodyInput.value = '';
      selectedWriteDots.clear();
      currentSequence = [];
      updateInputUI();
      renderNotes();
    }

    function deleteNote(id) {
      notes = notes.filter((n) => n.id !== id);
      persistNotes();
      renderNotes();
    }

    function renderNotes() {
      const listEl = document.getElementById('notes-list');
      const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
      const cat = document.getElementById('filter-category').value;

      const filtered = notes.filter((n) => {
        const matchCat = cat === 'ALL' || n.category === cat;
        const text = `${n.title} ${n.body} ${n.category}`.toLowerCase();
        const matchQ = !q || text.includes(q);
        return matchCat && matchQ;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="rounded-2xl border border-stone-200 bg-white p-6 text-center text-sm text-stone-500">
            該当するノートはまだありません。上のフォームから記録してみましょう。
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map((n) => {
        const cellsHtml = Array.isArray(n.cells) && n.cells.length > 0
          ? `<div class="flex flex-wrap items-center gap-2 my-3">
              ${n.cells.map((dots) => `
                <div class="flex flex-col items-center">
                  <div class="w-11 h-16 rounded-lg border border-stone-300 bg-paper grid grid-cols-2 grid-rows-3 place-items-center p-1">
                    ${buildMiniCellHtml(dots, READ_GRID_MAP, 'bg-plum-700')}
                  </div>
                  <span class="text-[10px] text-stone-500 mt-0.5">${dots.length ? dots.join(',') : '空白'}</span>
                </div>
              `).join('')}
            </div>`
          : '';

        return `
          <article class="rounded-2xl border border-stone-200 bg-white p-4 sm:p-5 shadow-sm">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-plum-100 text-plum-800 mb-1">
                  ${escapeHtml(n.category)}
                </span>
                <h3 class="text-base sm:text-lg font-bold text-ink-900">${escapeHtml(n.title)}</h3>
              </div>
              <div class="flex items-center gap-2 text-xs text-stone-400">
                <span>${escapeHtml(n.createdAt || '')}</span>
                <button
                  type="button"
                  onclick="deleteNote('${n.id}')"
                  class="text-terracotta-600 hover:underline font-medium"
                >
                  削除
                </button>
              </div>
            </div>
            ${cellsHtml}
            ${n.body ? `<p class="text-sm text-stone-700 whitespace-pre-line leading-relaxed">${escapeHtml(n.body)}</p>` : ''}
          </article>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function exportNotes() {
      const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tenyaku-note-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importNotes(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (!Array.isArray(imported)) throw new Error('形式が異なります');
          const existingIds = new Set(notes.map((n) => n.id));
          const merged = [...imported.filter((n) => !existingIds.has(n.id)), ...notes];
          notes = merged;
          persistNotes();
          renderNotes();
          alert('ノートを読み込みました。');
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // PCキーボード操作（J=1, K=2, L=3 / F=4, D=5, S=6 / Enterでマス追加）
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      const keyMap = {
        j: 1,
        k: 2,
        l: 3,
        f: 4,
        d: 5,
        s: 6
      };
      const lower = e.key.toLowerCase();
      if (keyMap[lower]) {
        e.preventDefault();
        toggleDot(keyMap[lower]);
      } else if (e.key === 'Enter' && selectedWriteDots.size > 0) {
        e.preventDefault();
        addCellToSequence();
      }
    });

    updateInputUI();
    renderNotes();
  </script>
</body>
</html>
