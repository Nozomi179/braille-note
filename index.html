<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>点訳note</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .dot-btn {
      width: 56px;
      height: 56px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1.125rem;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
    }
    .dot-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }
    .dot-btn:not(.active) {
      background-color: #ffffff;
      color: #334155;
      border: 2px solid #cbd5e1;
    }
    .braille-cell {
      display: inline-grid;
      grid-template-columns: repeat(2, 10px);
      grid-template-rows: repeat(3, 10px);
      gap: 3px;
      padding: 6px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      transition: all 0.12s ease;
    }
    .preview-removable-cell {
      cursor: pointer;
    }
    .preview-removable-cell:hover .braille-cell {
      background-color: #fef2f2;
      border-color: #f87171;
    }
    .preview-removable-blank {
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .preview-removable-blank:hover {
      background-color: #fef2f2;
      border-color: #f87171;
      color: #dc2626;
    }
    .braille-dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background-color: #e2e8f0;
    }
    .braille-dot.on {
      background-color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen pb-16">
  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-xl font-bold text-slate-800">点訳note</h1>
        <p class="text-xs text-slate-500">入力パッド：右123・左456 ／ 読む表示：左123・右456</p>
      </div>
      <div class="flex items-center gap-2">
        <button
          id="btnToggleHide"
          type="button"
          class="px-3 py-1.5 text-sm rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-medium"
        >
          👁️ 点字を隠す
        </button>
        <button
          id="btnOpenModal"
          type="button"
          class="px-3.5 py-1.5 text-sm rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-sm"
        >
          ＋ 新しいノート
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-5 space-y-5">
    <!-- 検索・タグ絞り込み・JSON保存読込 -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
      <div class="flex flex-col sm:flex-row gap-2">
        <input
          id="searchInput"
          type="text"
          placeholder="キーワードで検索（タイトル・読み方・メモ・タグ）..."
          class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <select
          id="tagFilter"
          class="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">すべてのタグ</option>
        </select>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-100">
        <span id="noteCount" class="text-xs text-slate-500">0件のノート</span>
        <div class="flex items-center gap-2">
          <button
            id="btnExportJson"
            type="button"
            class="px-2.5 py-1 text-xs rounded-md border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-700"
          >
            💾 JSON保存
          </button>
          <label
            class="px-2.5 py-1 text-xs rounded-md border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-700 cursor-pointer"
          >
            📂 JSON読込
            <input id="inputImportJson" type="file" accept=".json,application/json" class="hidden" />
          </label>
        </div>
      </div>
    </section>

    <!-- ノート一覧 -->
    <section id="notesList" class="space-y-3"></section>
  </main>

  <!-- ノート作成・編集モーダル -->
  <div
    id="noteModal"
    class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-30 overflow-y-auto"
  >
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl border border-slate-200 p-5 my-8 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 id="modalTitle" class="text-lg font-bold text-slate-800">新しいノートを作成</h2>
        <button
          id="btnCloseModal"
          type="button"
          class="text-slate-400 hover:text-slate-600 text-xl leading-none px-2"
          aria-label="閉じる"
        >
          ×
        </button>
      </div>

      <form id="noteForm" class="space-y-4">
        <input type="hidden" id="editId" />

        <div>
          <label for="noteTitle" class="block text-sm font-medium text-slate-700 mb-1">タイトル</label>
          <input
            id="noteTitle"
            type="text"
            required
            placeholder="例：長音符のメモ、濁音の確認など"
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="noteTag" class="block text-sm font-medium text-slate-700 mb-1">タグ（任意）</label>
          <input
            id="noteTag"
            type="text"
            placeholder="例：基本ルール、分かち書き、復習"
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- 6点入力パッド（左：4・5・6／右：1・2・3） -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-bold text-slate-800">6点入力パッド</p>
              <p class="text-xs text-slate-500">左の列：4・5・6 ／ 右の列：1・2・3</p>
            </div>
            <button
              id="btnClearPad"
              type="button"
              class="px-2.5 py-1 text-xs rounded border border-slate-300 bg-white hover:bg-slate-100 text-slate-600"
            >
              選択解除
            </button>
          </div>

          <!-- 左に4・5・6、右に1・2・3 -->
          <div class="flex items-center justify-center gap-8 py-1">
            <div class="flex flex-col items-center gap-2">
              <span class="text-[11px] text-slate-500 font-medium">左の列（4・5・6）</span>
              <button type="button" data-pad-dot="4" class="dot-btn">4</button>
              <button type="button" data-pad-dot="5" class="dot-btn">5</button>
              <button type="button" data-pad-dot="6" class="dot-btn">6</button>
            </div>
            <div class="flex flex-col items-center gap-2">
              <span class="text-[11px] text-slate-500 font-medium">右の列（1・2・3）</span>
              <button type="button" data-pad-dot="1" class="dot-btn">1</button>
              <button type="button" data-pad-dot="2" class="dot-btn">2</button>
              <button type="button" data-pad-dot="3" class="dot-btn">3</button>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-slate-200">
            <button
              id="btnInsertSpace"
              type="button"
              class="px-3 py-1.5 text-xs rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 font-medium"
            >
              空白（マスあけ）を追加
            </button>
            <button
              id="btnAddCell"
              type="button"
              class="px-3 py-1.5 text-xs rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium"
            >
              このマスを追加
            </button>
          </div>
        </div>

        <!-- 点字プレビュー（読む側：左123・右456／マスをタップすると削除） -->
        <div class="space-y-3">
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="block text-sm font-medium text-slate-700">点字プレビュー（読む側：左123・右456）</span>
              <span class="text-[11px] text-slate-500">マスをタップするとそのマスを消せます</span>
            </div>
            <input id="noteBraille" type="hidden" />
            <div id="braillePreview" class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex flex-wrap items-center gap-2 min-h-[48px]"></div>
          </div>

          <!-- 点字表示の下に配置するカタカナ読み方入力欄 -->
          <div>
            <label for="noteReading" class="block text-sm font-medium text-slate-700 mb-1">
              読み方（カタカナ）
            </label>
            <input
              id="noteReading"
              type="text"
              placeholder="例：ガッコウ、キョウ、ワカチガキ"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <div>
          <label for="noteMemo" class="block text-sm font-medium text-slate-700 mb-1">メモ・解説</label>
          <textarea
            id="noteMemo"
            rows="4"
            placeholder="気づいたことやルールなどを自由に書いてください。"
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
          <button
            id="btnCancelModal"
            type="button"
            class="px-4 py-2 text-sm rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700"
          >
            キャンセル
          </button>
          <button
            type="submit"
            class="px-4 py-2 text-sm rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium"
          >
            保存する
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'tenyaku_simple_notes_v1';

    let notes = [];
    let hideBraille = false;
    let selectedPadDots = new Set();

    // DOM要素
    const notesListEl = document.getElementById('notesList');
    const noteCountEl = document.getElementById('noteCount');
    const searchInputEl = document.getElementById('searchInput');
    const tagFilterEl = document.getElementById('tagFilter');
    const btnToggleHideEl = document.getElementById('btnToggleHide');

    const noteModalEl = document.getElementById('noteModal');
    const modalTitleEl = document.getElementById('modalTitle');
    const noteFormEl = document.getElementById('noteForm');
    const editIdEl = document.getElementById('editId');
    const noteTitleEl = document.getElementById('noteTitle');
    const noteTagEl = document.getElementById('noteTag');
    const noteBrailleEl = document.getElementById('noteBraille');
    const noteReadingEl = document.getElementById('noteReading');
    const noteMemoEl = document.getElementById('noteMemo');
    const braillePreviewEl = document.getElementById('braillePreview');

    function loadNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          notes = [];
          return;
        }
        const parsed = JSON.parse(raw);
        notes = Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        notes = [];
      }
    }

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseBrailleTokens(brailleStr) {
      const trimmed = (brailleStr || '').trim();
      if (!trimmed) return [];
      return trimmed.split(/\s+/).filter(Boolean);
    }

    // 読む側の6点セル（左の列: 1, 2, 3 ／ 右の列: 4, 5, 6）を描画
    // 入力パッドで選んだ点番号（1〜6）をそのまま読む側の該当位置に点灯させる
    function renderBrailleCellHtml(dots) {
      const set = new Set(dots);
      // 1行目: 1(左), 4(右)
      // 2行目: 2(左), 5(右)
      // 3行目: 3(左), 6(右)
      const order = [1, 4, 2, 5, 3, 6];
      const dotsHtml = order
        .map((d) => `<span class="braille-dot ${set.has(d) ? 'on' : ''}"></span>`)
        .join('');
      return `<span class="braille-cell" aria-label="点字マス">${dotsHtml}</span>`;
    }

    // ノート一覧などの読み取り専用表示用
    function renderBrailleSequence(brailleStr) {
      const tokens = parseBrailleTokens(brailleStr);
      if (tokens.length === 0) {
        return '<span class="text-xs text-slate-400">点字なし</span>';
      }
      return tokens
        .map((token) => {
          if (token === '/') {
            return '<span class="inline-flex items-center px-2 py-1 text-xs text-slate-400 bg-slate-100 rounded border border-dashed border-slate-300">空白</span>';
          }
          const nums = token
            .split(',')
            .map((n) => parseInt(n.trim(), 10))
            .filter((n) => n >= 1 && n <= 6);
          return renderBrailleCellHtml(nums);
        })
        .join('');
    }

    // プレビュー用（各マスをタップして削除できるボタンとして描画）
    function renderRemovablePreview(brailleStr) {
      const tokens = parseBrailleTokens(brailleStr);
      if (tokens.length === 0) {
        return '<span class="text-xs text-slate-400">6点パッドからマスを追加するとここに表示されます</span>';
      }
      return tokens
        .map((token, idx) => {
          if (token === '/') {
            return `<button
              type="button"
              data-token-index="${idx}"
              title="タップしてこの空白を削除"
              aria-label="${idx + 1}番目の空白を削除"
              class="preview-removable-blank inline-flex items-center px-2 py-1 text-xs text-slate-400 bg-white rounded border border-dashed border-slate-300"
            >空白</button>`;
          }
          const nums = token
            .split(',')
            .map((n) => parseInt(n.trim(), 10))
            .filter((n) => n >= 1 && n <= 6);
          return `<button
            type="button"
            data-token-index="${idx}"
            title="タップしてこのマスを削除"
            aria-label="${idx + 1}番目の点字マスを削除"
            class="preview-removable-cell inline-flex items-center justify-center rounded-md focus:outline-none focus:ring-2 focus:ring-red-400"
          >${renderBrailleCellHtml(nums)}</button>`;
        })
        .join('');
    }

    function updateTagFilterOptions() {
      const current = tagFilterEl.value;
      const tags = Array.from(
        new Set(notes.map((n) => (n.tag || '').trim()).filter(Boolean))
      ).sort();

      tagFilterEl.innerHTML = '<option value="">すべてのタグ</option>';
      tags.forEach((tag) => {
        const opt = document.createElement('option');
        opt.value = tag;
        opt.textContent = tag;
        tagFilterEl.appendChild(opt);
      });

      if (tags.includes(current)) {
        tagFilterEl.value = current;
      } else {
        tagFilterEl.value = '';
      }
    }

    function renderNotes() {
      updateTagFilterOptions();

      const query = (searchInputEl.value || '').trim().toLowerCase();
      const selectedTag = tagFilterEl.value;

      const filtered = notes.filter((note) => {
        const matchTag = !selectedTag || (note.tag || '').trim() === selectedTag;
        if (!matchTag) return false;
        if (!query) return true;
        const hay = `${note.title || ''} ${note.reading || ''} ${note.tag || ''} ${note.memo || ''} ${note.braille || ''}`.toLowerCase();
        return hay.includes(query);
      });

      noteCountEl.textContent = `${filtered.length}件のノート（全${notes.length}件）`;

      if (filtered.length === 0) {
        notesListEl.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-xl p-8 text-center text-slate-500 text-sm">
            ${notes.length === 0
              ? 'まだノートがありません。「＋ 新しいノート」から記録を始めましょう。'
              : '条件に一致するノートが見つかりませんでした。'}
          </div>
        `;
        return;
      }

      notesListEl.innerHTML = filtered
        .map((note) => {
          const tagBadge = note.tag
            ? `<span class="px-2 py-0.5 text-xs rounded-full bg-blue-50 text-blue-700 border border-blue-200">${escapeHtml(note.tag)}</span>`
            : '';

          // 点字表示は「点字を隠す」ボタンと連動、読み方（カタカナ）は独立して表示
          const brailleSection = hideBraille
            ? `<div class="px-3 py-2 rounded-lg bg-slate-100 text-xs text-slate-500">👁️ 点字は非表示モード中です</div>`
            : `<div class="flex flex-wrap items-center gap-2">${renderBrailleSequence(note.braille)}</div>`;

          const readingSection = note.reading
            ? `<div class="text-sm font-medium text-slate-700 bg-slate-50 border border-slate-200/80 rounded-lg px-3 py-1.5">読み方：${escapeHtml(note.reading)}</div>`
            : '';

          return `
            <article class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
              <div class="flex items-start justify-between gap-2">
                <div class="space-y-1">
                  <div class="flex flex-wrap items-center gap-2">
                    <h3 class="font-bold text-slate-800 text-base">${escapeHtml(note.title)}</h3>
                    ${tagBadge}
                  </div>
                  <p class="text-[11px] text-slate-400">更新：${escapeHtml(note.updatedAt || '')}</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button
                    type="button"
                    onclick="openEditModal('${escapeHtml(note.id)}')"
                    class="px-2.5 py-1 text-xs rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700"
                  >
                    ✏️ 編集
                  </button>
                  <button
                    type="button"
                    onclick="deleteNote('${escapeHtml(note.id)}')"
                    class="px-2.5 py-1 text-xs rounded-lg border border-red-200 hover:bg-red-50 text-red-600"
                  >
                    🗑️ 削除
                  </button>
                </div>
              </div>

              ${brailleSection}

              ${readingSection}

              ${note.memo ? `<p class="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">${escapeHtml(note.memo)}</p>` : ''}
            </article>
          `;
        })
        .join('');
    }

    function updatePadUi() {
      document.querySelectorAll('[data-pad-dot]').forEach((btn) => {
        const d = parseInt(btn.getAttribute('data-pad-dot'), 10);
        btn.classList.toggle('active', selectedPadDots.has(d));
      });
    }

    function refreshPreview() {
      braillePreviewEl.innerHTML = renderRemovablePreview(noteBrailleEl.value);
    }

    function appendToBrailleInput(token) {
      const current = (noteBrailleEl.value || '').trim();
      noteBrailleEl.value = current ? `${current} ${token}` : token;
      refreshPreview();
    }

    function removeTokenAt(index) {
      const tokens = parseBrailleTokens(noteBrailleEl.value);
      if (index < 0 || index >= tokens.length) return;
      tokens.splice(index, 1);
      noteBrailleEl.value = tokens.join(' ');
      refreshPreview();
    }

    function openCreateModal() {
      modalTitleEl.textContent = '新しいノートを作成';
      editIdEl.value = '';
      noteTitleEl.value = '';
      noteTagEl.value = '';
      noteBrailleEl.value = '';
      noteReadingEl.value = '';
      noteMemoEl.value = '';
      selectedPadDots.clear();
      updatePadUi();
      refreshPreview();
      noteModalEl.classList.remove('hidden');
      noteModalEl.classList.add('flex');
      noteTitleEl.focus();
    }

    window.openEditModal = function (id) {
      const target = notes.find((n) => n.id === id);
      if (!target) return;
      modalTitleEl.textContent = 'ノートを編集';
      editIdEl.value = target.id;
      noteTitleEl.value = target.title || '';
      noteTagEl.value = target.tag || '';
      noteBrailleEl.value = target.braille || '';
      noteReadingEl.value = target.reading || '';
      noteMemoEl.value = target.memo || '';
      selectedPadDots.clear();
      updatePadUi();
      refreshPreview();
      noteModalEl.classList.remove('hidden');
      noteModalEl.classList.add('flex');
      noteTitleEl.focus();
    };

    window.deleteNote = function (id) {
      if (!confirm('このノートを削除しますか？')) return;
      notes = notes.filter((n) => n.id !== id);
      saveNotes();
      renderNotes();
    };

    function closeModal() {
      noteModalEl.classList.add('hidden');
      noteModalEl.classList.remove('flex');
    }

    function formatNow() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // イベント登録
    document.getElementById('btnOpenModal').addEventListener('click', openCreateModal);
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('btnCancelModal').addEventListener('click', closeModal);

    noteModalEl.addEventListener('click', (e) => {
      if (e.target === noteModalEl) closeModal();
    });

    braillePreviewEl.addEventListener('click', (e) => {
      const targetBtn = e.target.closest('[data-token-index]');
      if (!targetBtn) return;
      const idx = parseInt(targetBtn.getAttribute('data-token-index'), 10);
      if (!Number.isNaN(idx)) {
        removeTokenAt(idx);
      }
    });

    document.querySelectorAll('[data-pad-dot]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const d = parseInt(btn.getAttribute('data-pad-dot'), 10);
        if (selectedPadDots.has(d)) {
          selectedPadDots.delete(d);
        } else {
          selectedPadDots.add(d);
        }
        updatePadUi();
      });
    });

    document.getElementById('btnClearPad').addEventListener('click', () => {
      selectedPadDots.clear();
      updatePadUi();
    });

    document.getElementById('btnAddCell').addEventListener('click', () => {
      if (selectedPadDots.size === 0) return;
      const sortedDots = Array.from(selectedPadDots).sort((a, b) => a - b);
      appendToBrailleInput(sortedDots.join(','));
      selectedPadDots.clear();
      updatePadUi();
    });

    document.getElementById('btnInsertSpace').addEventListener('click', () => {
      appendToBrailleInput('/');
    });

    noteFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = (noteTitleEl.value || '').trim();
      if (!title) return;

      const id = editIdEl.value;
      const payload = {
        id: id || `note_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        title,
        tag: (noteTagEl.value || '').trim(),
        braille: (noteBrailleEl.value || '').trim(),
        reading: (noteReadingEl.value || '').trim(),
        memo: (noteMemoEl.value || '').trim(),
        updatedAt: formatNow(),
      };

      if (id) {
        const idx = notes.findIndex((n) => n.id === id);
        if (idx !== -1) {
          notes[idx] = payload;
        } else {
          notes.unshift(payload);
        }
      } else {
        notes.unshift(payload);
      }

      saveNotes();
      renderNotes();
      closeModal();
    });

    btnToggleHideEl.addEventListener('click', () => {
      hideBraille = !hideBraille;
      btnToggleHideEl.textContent = hideBraille ? '👁️ 点字を表示' : '👁️ 点字を隠す';
      renderNotes();
    });

    searchInputEl.addEventListener('input', renderNotes);
    tagFilterEl.addEventListener('change', renderNotes);

    // JSON保存（エクスポート）
    document.getElementById('btnExportJson').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tenyaku_notes_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // JSON読込（インポート）
    document.getElementById('inputImportJson').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!Array.isArray(parsed)) {
            alert('不正なJSON形式です。');
            return;
          }
          if (!confirm(`現在のノートを置き換えて ${parsed.length} 件のノートを読み込みますか？`)) {
            return;
          }
          notes = parsed.map((item) => ({
            id: item.id || `note_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            title: String(item.title || '無題'),
            tag: String(item.tag || ''),
            braille: String(item.braille || ''),
            reading: String(item.reading || ''),
            memo: String(item.memo || ''),
            updatedAt: String(item.updatedAt || formatNow()),
          }));
          saveNotes();
          renderNotes();
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。');
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsText(file);
    });

    // 初期化
    loadNotes();
    renderNotes();
  </script>
</body>
</html>
